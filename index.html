<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotas</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --fill: #2a78d6;
    --warning: #fab219;
    --critical: #d03b3b;
    --warning-ink: #8a5a00;
    --critical-ink: #b02a2a;
    --healthy: #247345;
    --claude: #c96442;
    --openai: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink-1: #f0efec;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --fill: #3987e5;
      --warning-ink: #fab219;
      --critical-ink: #e66767;
      --healthy: #6fcf97;
      --claude: #d97757;
      --openai: #f0efec;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink-1);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px; }

  .top { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .top .meta { color: var(--ink-muted); font-size: 13px; margin-top: 2px; }
  .top .actions { margin-left: auto; display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink-1); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--ink-muted); }
  button[aria-pressed="true"] { background: var(--hairline); }
  button:disabled { opacity: 0.5; cursor: default; }

  .banner { border: 1px solid var(--border); border-left: 3px solid var(--critical); background: var(--surface);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: var(--ink-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 6px; }
  .card-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline); }
  .mono { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none;
    font-weight: 700; font-size: 13px; color: var(--surface); }
  .mono.claude { background: var(--claude); }
  .mono.openai { background: var(--openai); }
  .who { min-width: 0; }
  .who .name { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .plan { font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .who .sub { color: var(--ink-muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fresh { margin-left: auto; font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
  .fresh.stale { color: var(--warning-ink); }
  .card-error { color: var(--ink-2); font-size: 13px; padding: 12px 0; }
  .card-error code, .empty code { font-size: 12px; background: var(--hairline); padding: 1px 5px; border-radius: 4px; }

  .win { padding: 14px 0; border-bottom: 1px solid var(--hairline); outline: none; border-radius: 4px; }
  .win:last-child { border-bottom: 0; }
  .win:focus-visible { box-shadow: 0 0 0 2px var(--fill); }
  .win-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .win-label { font-weight: 600; color: var(--ink-2); font-size: 13px; }
  .win-reset { color: var(--ink-muted); font-size: 12.5px; white-space: nowrap; }
  .win-main { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 8px; }
  .big { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.05; }
  .big-unit { color: var(--ink-muted); font-size: 13px; }
  .status { margin-left: auto; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .status.warning { color: var(--warning-ink); }
  .status.critical { color: var(--critical-ink); }

  .meter { --c: var(--fill); position: relative; height: 8px; border-radius: 4px;
    background: color-mix(in oklab, var(--c) 20%, var(--surface)); }
  .meter.warning { --c: var(--warning); }
  .meter.critical { --c: var(--critical); }
  .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--c); }
  .meter .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px;
    background: var(--ink-1); box-shadow: 0 0 0 2px var(--surface); }
  .win-foot { margin-top: 8px; font-size: 12.5px; color: var(--ink-muted); min-height: 17px; }
  .win-foot.warn { color: var(--warning-ink); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  th { color: var(--ink-muted); font-weight: 600; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .table-scroll { overflow-x: auto; }

  .workspace { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 24px; }
  .workspace-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  .workspace h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .workspace-meta, .workspace-note { color: var(--ink-muted); font-size: 12px; }
  .workspace-note { margin: 12px 0 0; }
  .workspace-note.warning { color: var(--warning-ink); }
  .machine-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 18px 0; }
  .machine-metric { min-width: 0; }
  .metric-label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .metric-value { font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -0.02em; margin: 4px 0 6px; }
  .metric-value.warning { color: var(--warning-ink); }
  .metric-value.critical { color: var(--critical-ink); }
  .metric-value.healthy { color: var(--healthy); }
  .metric-detail { font-size: 12px; color: var(--ink-muted); overflow-wrap: anywhere; }
  .machine-metric .meter { margin-top: 9px; height: 5px; }
  .services { list-style: none; margin: 0; padding: 14px 0 0; border-top: 1px solid var(--hairline);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; }
  .service-name { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
  .service-state { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 3px; color: var(--ink-muted); }
  .service-state.healthy { color: var(--healthy); }
  .service-state.warning { color: var(--warning-ink); }
  .service-state.critical { color: var(--critical-ink); }
  .health-dot { height: 6px; width: 6px; background: currentColor; border-radius: 50%; flex: none; }
  .health-check { font-size: 11.5px; color: var(--ink-muted); margin-top: 4px; overflow-wrap: anywhere; }
  .health-check.healthy, .diagnostic-status.healthy { color: var(--healthy); }
  .health-check.warning, .diagnostic-status.warning { color: var(--warning-ink); }
  .health-check.critical, .diagnostic-status.critical { color: var(--critical-ink); }
  .service-meta { color: var(--ink-muted); font-size: 11px; margin-top: 5px; }
  .diagnostics { margin-top: 28px; }
  .diagnostics-heading { margin: 0 0 12px; font-size: 17px; font-weight: 650; }
  .diagnostics-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .diagnostic-card { min-width: 0; padding: 18px 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  .diagnostic-card h3 { font-size: 14px; margin: 0 0 12px; font-weight: 650; }
  .workflow-card { grid-column: 1 / -1; }
  .workflow-summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 12px; }
  .workflow-summary .diagnostic-detail { margin: 0; }
  .workflow-plans { margin: 16px 0; }
  .workflow-plans .meter { height: 5px; margin: 4px 0 8px; }
  .workflow-jobs { margin-top: 16px; }
  .workflow-jobs h4 { font-size: 12.5px; margin: 0 0 8px; font-weight: 600; }
  .workflow-process-table th, .workflow-process-table td { padding: 8px 10px; font-size: 12px; }
  .workflow-process-table .process-description { display: block; color: var(--ink-muted); font-size: 11px; margin-top: 2px; }
  .diagnostic-status { font-size: 12.5px; font-weight: 600; }
  .diagnostic-detail { color: var(--ink-muted); font-size: 12px; margin: 5px 0 12px; overflow-wrap: anywhere; }
  .pressure-readings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 16px; }
  .pressure-readings span { display: block; font-size: 12px; color: var(--ink-muted); }
  .pressure-readings strong { display: block; font-size: 18px; font-weight: 600; }
  .diagnostic-list { padding: 0; margin: 0; list-style: none; }
  .process-row, .diagnostic-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; font-size: 12px; border-top: 1px solid var(--hairline); }
  .process-row .process-name { min-width: 0; overflow-wrap: anywhere; }
  .process-row .process-memory { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .disk { margin: 12px 0 18px; }
  .disk .meter { height: 5px; margin-top: 8px; }
  .disk .diagnostic-detail { margin-bottom: 0; }
  .latency-chart { display: block; width: 100%; height: 62px; color: var(--fill); margin: 8px 0; }
  .latency-chart .failed-sample { fill: var(--critical); }
  .event-row { display: grid; grid-template-columns: 6px minmax(0, 1fr); column-gap: 9px; padding: 7px 0; border-top: 1px solid var(--hairline); }
  .event-row .health-dot { margin-top: 5px; background: var(--fill); }
  .event-row.warning .health-dot { background: var(--warning); }
  .event-row.critical .health-dot { background: var(--critical); }
  .event-title { font-size: 12px; overflow-wrap: anywhere; }
  .event-time { display: block; margin-top: 2px; font-size: 11px; color: var(--ink-muted); }
  @media (max-width: 700px) {
    .machine-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
    .diagnostics-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 420px) {
    main { padding: 24px 16px 32px; }
    .top { flex-wrap: wrap; }
    .top .actions { margin-left: 0; }
    .workspace, .card { padding-left: 16px; padding-right: 16px; }
    .services { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .win-top { flex-wrap: wrap; gap: 2px 8px; }
    .who .name { flex-wrap: wrap; gap: 3px 6px; }
  }

  .legend { margin-top: 20px; color: var(--ink-muted); font-size: 12px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 18px; height: 6px; border-radius: 3px; background: var(--fill); }
  .legend .tick { width: 2px; height: 12px; background: var(--ink-1); border-radius: 1px; }
  .empty { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; color: var(--ink-2); }

  #tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18); max-width: 280px; display: none; }
  #tip .k { color: var(--ink-muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Quotas</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="actions">
      <button id="view" aria-pressed="false">Table</button>
      <button id="refresh">Refresh</button>
    </div>
  </div>
  <section class="workspace" aria-labelledby="workspace-title">
    <div class="workspace-head">
      <h2 id="workspace-title">Workspace computer</h2>
      <div class="workspace-meta" id="workspace-meta">Checking laptop…</div>
    </div>
    <div id="workspace-content"><p class="workspace-note">Loading computer status…</p></div>
    <p class="workspace-note" id="workspace-error" role="status" hidden></p>
  </section>
  <div id="banner"></div>
  <div id="content"></div>
  <div class="legend" id="legend" hidden>
    <span class="key"><span class="swatch"></span>Quota left</span>
    <span class="key"><span class="tick"></span>Time left in the window. A bar that ends left of the tick means you're using it faster than it resets.</span>
  </div>
  <section class="diagnostics" id="workspace-diagnostics" aria-label="Computer diagnostics" hidden></section>
</main>
<div id="tip" role="tooltip"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let data = null;
  let tableView = false;
  let loading = false;
  let reloadTimer = null;
  let workspace = null;
  let workspaceLoading = false;
  let workspaceError = false;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));
    const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
    if (d) return h ? `${d}d ${h}h` : `${d}d`;
    if (h) return m ? `${h}h ${m}m` : `${h}h`;
    return m ? `${m}m` : '<1m';
  }
  function fmtClock(ms) {
    const t = new Date(ms), now = new Date();
    const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (t.toDateString() === now.toDateString()) return time;
    if (ms - now < 6 * 86400e3) return `${t.toLocaleDateString([], { weekday: 'short' })} ${time}`;
    return t.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  const fmtFull = (ms) => new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  function fmtWindow(sec) {
    if (!sec) return 'n/a';
    if (sec % 86400 === 0) return `${sec / 86400} day${sec === 86400 ? '' : 's'}`;
    return `${+(sec / 3600).toFixed(1)} hours`;
  }
  const ago = (ms) => (Date.now() - ms < 60e3 ? 'just now' : `${fmtDur((Date.now() - ms) / 1000)} ago`);

  const gib = (bytes) => `${(bytes / 1024 ** 3).toFixed(1)} GiB`;

  function machineMetric(label, value, detail, level = '', percent = null) {
    return `<div class="machine-metric">
      <div class="metric-label">${esc(label)}</div>
      <div class="metric-value ${level}">${esc(value)}</div>
      <div class="metric-detail">${esc(detail)}</div>
      ${percent != null ? `<div class="meter ${level}" aria-hidden="true"><div class="fill" style="width:${Math.max(0, Math.min(100, percent))}%"></div></div>` : ''}
    </div>`;
  }

  function renderWorkspace() {
    const stale = workspaceError || (workspace && Date.now() - workspace.generatedAt > 90_000);
    $('workspace-error').hidden = !stale;
    $('workspace-error').className = 'workspace-note warning';
    $('workspace-error').textContent = workspaceError
      ? `Can't update computer status.${workspace ? ' Showing the last reading.' : ' Retrying every 30 seconds.'}`
      : 'Computer readings are old. Waiting for an update…';
    if (!workspace) {
      if (workspaceError) {
        $('workspace-meta').textContent = 'Unavailable';
        $('workspace-content').innerHTML = '';
      }
      return;
    }
    if (!workspace.supported) {
      $('workspace-diagnostics').hidden = true;
      $('workspace-meta').textContent = '';
      $('workspace-content').innerHTML = '<p class="workspace-note">Computer monitoring is available on Linux.</p>';
      return;
    }
    $('workspace-meta').textContent = `${workspace.model} · up ${fmtDur(workspace.uptimeSec)} · checked ${ago(workspace.generatedAt)}`;
    const battery = workspace.power.batteries[0];
    const ac = workspace.power.acOnline;
    const onBattery = ac === false || battery?.status === 'Discharging';
    const powerDetail = [ac === true ? 'Plugged in' : ac === false ? 'On battery' : 'Power source unknown', battery?.status].filter(Boolean).join(' · ');
    const batteryLevel = onBattery && battery?.percent != null ? (battery.percent <= 10 ? 'critical' : battery.percent <= 30 ? 'warning' : '') : '';
    const sensor = workspace.temperatures.find((s) => s.name === 'CPU') || workspace.temperatures[0];
    const tempLevel = sensor?.criticalCelsius != null
      ? (sensor.celsius >= sensor.criticalCelsius ? 'critical' : sensor.celsius >= sensor.criticalCelsius - 10 ? 'warning' : '') : '';
    const tempDetail = sensor
      ? [sensor.name, ...workspace.temperatures.filter((s) => s !== sensor).map((s) => `${s.name} ${Math.round(s.celsius)}°C`)].join(' · ')
      : 'No readable temperature sensors';
    const memory = workspace.memory;
    const memoryLevel = ['warning', 'critical'].includes(workspace.diagnostics?.memoryLevel) ? workspace.diagnostics.memoryLevel : '';
    const net = workspace.internet;
    const netLabels = { online: 'Online', limited: 'Limited', portal: 'Sign-in needed', offline: 'Offline', unknown: 'Unknown' };
    const netDetails = { online: `Internet reachable · ${net.latencyMs} ms`, limited: 'HTTPS checks failed; network connected', portal: 'Network sign-in may be required', offline: 'No internet connection detected', unknown: 'Could not verify internet access' };
    const networkName = net.networkName ? `${net.networkType === 'wifi' ? 'Wi-Fi' : 'Ethernet'}: ${net.networkName}` : '';
    const internetDetail = [networkName, net.signalPct != null ? `${net.signalPct}% signal` : '', netDetails[net.state] || netDetails.unknown].filter(Boolean).join(' · ');
    const metrics = [
      machineMetric('Battery', battery?.percent != null ? `${Math.round(battery.percent)}%` : '—', battery ? powerDetail : 'No readable battery', batteryLevel, battery?.percent),
      machineMetric('Temperature', sensor ? `${Math.round(sensor.celsius)}°C` : '—', tempDetail, tempLevel),
      machineMetric('Memory', memory ? `${Math.round(memory.usedPct)}%` : '—', memory ? `${gib(memory.usedBytes)} / ${gib(memory.totalBytes)} used${memory.swapUsedBytes != null ? ` · ${gib(memory.swapUsedBytes)} swap` : ''}` : 'Memory reading unavailable', memoryLevel, memory?.usedPct),
      machineMetric('Internet', netLabels[net.state] || 'Unknown', internetDetail, net.state === 'online' ? 'healthy' : net.state === 'offline' ? 'critical' : 'warning'),
    ];
    const stateLabels = { running: 'Running', stopped: 'Stopped', failed: 'Failed', 'not-found': 'Not installed', unknown: 'Unknown', activating: 'Starting', deactivating: 'Stopping', reloading: 'Reloading', exited: 'Exited' };
    const services = workspace.services.map((s) => {
      const serviceChecks = (workspace.diagnostics?.healthChecks || []).filter((c) => c.service === s.unit);
      const failedCheck = serviceChecks.some((c) => c.state === 'unhealthy');
      const level = failedCheck ? 'critical' : s.state === 'running' ? 'healthy' : ['failed', 'stopped'].includes(s.state) ? 'critical' : 'warning';
      const checks = serviceChecks.map((c) => {
        const state = c.state === 'healthy' ? 'healthy' : c.state === 'unhealthy' ? 'critical' : 'warning';
        const detail = c.state === 'healthy' ? `OK${c.latencyMs != null ? ` · ${c.latencyMs} ms` : ''}` : c.detail;
        return `<div class="health-check ${state}" title="${esc(`Checked ${ago(c.checkedAt)}`)}">${esc(c.label)}: ${esc(detail)}${c.id === 'ngrok-public' ? ` · ${esc(ago(c.checkedAt))}` : ''}</div>`;
      }).join('');
      const restarts = s.automaticRestarts != null ? `<div class="service-meta">${s.automaticRestarts} auto restarts${s.startedAt ? ` · up ${esc(fmtDur((Date.now() - s.startedAt) / 1000))}` : ''}</div>` : '';
      return `<li><div class="service-name">${esc(s.name)}</div><div class="service-state ${level}"><span class="health-dot" aria-hidden="true"></span>${esc(stateLabels[s.state] || s.state)}${failedCheck && s.state === 'running' ? ' · Check failed' : ''}</div>${checks}${restarts}</li>`;
    }).join('');
    $('workspace-content').innerHTML = `<div class="machine-metrics">${metrics.join('')}</div><ul class="services" aria-label="Services">${services}</ul>`;
    renderDiagnostics();
  }

  const mib = (bytes) => bytes >= 1024 ** 3 ? gib(bytes) : `${Math.round(bytes / 1024 ** 2)} MiB`;

  function renderLatency(samples) {
    if (!samples.length) return '<p class="diagnostic-detail">Collecting connection history…</p>';
    const first = samples[0].timestamp, last = samples.at(-1).timestamp;
    const max = Math.max(100, ...samples.filter((s) => s.latencyMs != null).map((s) => s.latencyMs));
    let previous = null;
    const parts = samples.map((s) => {
      const x = 6 + (s.timestamp - first) / Math.max(30_000, last - first) * 288;
      if (s.state !== 'online' || s.latencyMs == null) {
        previous = null;
        return `<circle class="failed-sample" cx="${x}" cy="53" r="3"/>`;
      }
      const y = 53 - Math.min(1, s.latencyMs / max) * 45;
      const segment = previous ? `<line x1="${previous.x}" y1="${previous.y}" x2="${x}" y2="${y}" stroke="currentColor" stroke-width="1.5"/>` : '';
      previous = { x, y };
      return `${segment}<circle cx="${x}" cy="${y}" r="2" fill="currentColor"/>`;
    }).join('');
    const failures = samples.filter((s) => s.state !== 'online').length;
    const successful = samples.filter((s) => s.state === 'online' && s.latencyMs != null).map((s) => s.latencyMs);
    const range = successful.length ? `${Math.min(...successful)}–${Math.max(...successful)} ms` : 'No successful checks';
    return `<svg class="latency-chart" viewBox="0 0 300 62" role="img" aria-label="Internet check response times; red dots indicate unsuccessful checks">${parts}</svg>
      <div class="diagnostic-detail">${esc(range)} · ${failures} of ${samples.length} internet checks unsuccessful · since ${esc(fmtClock(first))}. Up to 30 minutes shown.</div>`;
  }

  function renderDiagnostics() {
    const target = $('workspace-diagnostics'), d = workspace?.diagnostics;
    target.hidden = !workspace?.supported || !d;
    if (target.hidden) return;
    const history = workspace.history;
    const pressureLabels = { healthy: 'Memory has headroom', warning: 'Memory needs attention', critical: 'Memory under pressure', unknown: 'Memory pressure unavailable' };
    const pressure = ['cpu', 'memory', 'io'].map((name) => {
      const value = d.pressure[name]?.some?.avg10;
      return `<div><span>${{ cpu: 'CPU wait', memory: 'Memory stalls', io: 'I/O wait' }[name]}</span><strong>${value != null ? `${value.toFixed(1)}%` : '—'}</strong></div>`;
    }).join('');
    const processes = d.topProcesses.map((p) => `<li class="process-row"><span class="process-name">${esc(p.name)} <span class="workspace-meta">#${p.pid}</span></span><span class="process-memory">${esc(mib(p.rssBytes))}</span></li>`).join('');
    const disks = d.disks.map((disk) => {
      const level = disk.mounted === false || disk.readOnly || disk.usedPct >= 95 ? 'critical' : disk.usedPct >= 90 ? 'warning' : '';
      const detail = disk.mounted === false ? 'Not mounted' : disk.mounted == null ? 'Mount status unavailable'
        : `${disk.freeBytes == null ? 'Space reading unavailable' : `${gib(disk.freeBytes)} free of ${gib(disk.totalBytes)}`}${disk.readOnly ? ' · Read-only' : ''}`;
      return `<div class="disk"><div class="diagnostic-row"><span>${esc(disk.name)}</span><span class="diagnostic-status ${level}">${disk.usedPct != null ? `${disk.usedPct}% used` : '—'}</span></div>
        <div class="diagnostic-detail">${esc(disk.path)} · ${esc(detail)}</div>${disk.usedPct != null ? `<div class="meter ${level}" aria-hidden="true"><div class="fill" style="width:${disk.usedPct}%"></div></div>` : ''}</div>`;
    }).join('');
    const backup = d.backup;
    const oldBackup = backup.lastSuccessAt && Date.now() - backup.lastSuccessAt > 36 * 3600_000;
    const backupLevel = backup.state === 'failed' ? 'critical' : oldBackup || backup.scheduleActive === false ? 'warning' : backup.state === 'success' ? 'healthy' : '';
    const backupLabel = oldBackup && backup.state === 'success' ? 'No successful backup in 36h'
      : { success: 'Last run succeeded', failed: 'Last run failed', running: 'Backup running', 'never-run': 'No completed run recorded', unknown: 'Status unavailable' }[backup.state] || 'Status unavailable';
    const backupDetail = [backup.lastSuccessAt ? `Last success ${fmtFull(backup.lastSuccessAt)}` : 'Last success unknown',
      backup.scheduleActive === false ? 'Schedule inactive' : backup.nextRunAt ? `Next ${fmtFull(backup.nextRunAt)}` : 'Next run unknown'].join(' · ');
    const routes = d.tailscale.connections.map((c) => `${c.count} ${c.type === 'peer-relay' ? 'peer relay' : c.type} connection${c.count === 1 ? '' : 's'}`).join(' · ');
    const tailscale = d.tailscale.state === 'running' ? routes || 'Connected · no active peer traffic' : d.tailscale.state === 'offline' ? 'Not connected' : 'Status unavailable';
    const events = (history?.events || []).slice(0, 10).map((e) => `<li class="event-row ${e.level === 'critical' ? 'critical' : e.level === 'warning' ? 'warning' : ''}"><span class="health-dot" aria-hidden="true"></span><div class="event-title">${esc(e.title)}<time class="event-time" datetime="${new Date(e.timestamp).toISOString()}">${esc(fmtFull(e.timestamp))} · ${esc(ago(e.timestamp))}</time></div></li>`).join('');
    target.innerHTML = `<h2 class="diagnostics-heading">Computer diagnostics</h2><div class="diagnostics-grid">${d.agentWorkflow ? renderAgentWorkflow(d.agentWorkflow) : ''}
      <article class="diagnostic-card"><h3>Memory & processes</h3><div class="diagnostic-status ${d.memoryLevel === 'critical' ? 'critical' : d.memoryLevel === 'warning' ? 'warning' : ''}">${esc(pressureLabels[d.memoryLevel] || pressureLabels.unknown)}</div>
        <div class="pressure-readings">${pressure}</div><p class="diagnostic-detail">Time tasks spent waiting during the last 10 seconds. Top five processes by resident memory:</p><ul class="diagnostic-list">${processes || '<li class="diagnostic-detail">Process readings unavailable</li>'}</ul></article>
      <article class="diagnostic-card"><h3>Storage & backup</h3>${disks}<div class="diagnostic-row"><span>T7 backup</span><span class="diagnostic-status ${backupLevel}">${esc(backupLabel)}</span></div><p class="diagnostic-detail">${esc(backupDetail)}</p></article>
      <article class="diagnostic-card"><h3>Connection quality</h3><div class="diagnostic-row"><span>Wi-Fi signal</span><span>${workspace.internet.signalPct != null ? `${workspace.internet.signalPct}%` : '—'}</span></div>
        <div class="diagnostic-row"><span>Wi-Fi link rate</span><span>${esc(workspace.internet.linkRate || '—')}</span></div><div class="diagnostic-row"><span>Tailscale</span><span>${esc(tailscale)}</span></div>${renderLatency(history?.samples || [])}<p class="diagnostic-detail">Link rate is the Wi-Fi connection rate. Internet timings are HTTPS response times from this laptop.</p></article>
      <article class="diagnostic-card"><h3>Recent events</h3><ul class="diagnostic-list">${events || '<li class="diagnostic-detail">No recent events</li>'}</ul><p class="diagnostic-detail">Latest 10 events · sampled every 30 seconds, even with this page closed. ${history?.persisted === false ? 'History could not be saved.' : 'History is retained for seven days.'}</p></article>
    </div>`;
  }

  function renderAgentWorkflow(workflow) {
    const level = workflow.pumpState === 'failed' || workflow.staleCount > 0 ? 'critical'
      : workflow.paused || workflow.timerActive === false || workflow.reason === 'Waiting for quota' ? 'warning' : '';
    const count = workflow.available ? `${workflow.count} related process${workflow.count === 1 ? '' : 'es'}` : 'Process readings unavailable';
    const resources = workflow.available ? `CPU avg ${workflow.cpuPct.toFixed(1)}% · Summed RSS ${mib(workflow.rssBytes)}` : '';
    const pump = `Pump ${workflow.pumpState} · Timer ${workflow.timerActive == null ? 'unknown' : workflow.timerActive ? 'active' : 'inactive'}`;
    const tick = workflow.lastTickAt ? `Last tick ${ago(workflow.lastTickAt)}` : 'Last tick unknown';
    const plans = workflow.dailyPlans;
    const plansKnown = plans?.launched != null && plans?.limit != null;
    const plansReached = plansKnown && plans.launched >= plans.limit;
    const plansLevel = plansReached ? 'warning' : '';
    const plansPct = plansKnown ? plans.limit > 0 ? Math.min(100, 100 * plans.launched / plans.limit) : 100 : null;
    const plansDetail = [plans?.remaining != null ? `${plans.remaining} remaining${plansReached ? ' · Daily limit reached' : ''}` : 'Daily plan reading unavailable',
      plans?.resetsAt ? `Resets ${fmtClock(plans.resetsAt)} (00:00 UTC)` : ''].filter(Boolean).join(' · ');
    const states = { R: 'Running', S: 'Sleeping', D: 'I/O wait', T: 'Stopped', t: 'Tracing stop', Z: 'Zombie', I: 'Idle', P: 'Parked', X: 'Exited' };
    const rows = workflow.processes.map((p) => {
      const role = p.role === 'agentctl' ? `agentctl ${p.command || ''}` : p.role === 'child' ? `Child of #${p.rootPid}` : 'build-workflow';
      const stateLevel = ['Z', 'T', 't', 'D'].includes(p.state) ? 'warning' : '';
      return `<tr><td>${esc(p.name)}<span class="process-description">${esc(role)} · parent #${p.ppid}</span></td><td class="num">${p.pid}</td><td class="num">${p.cpuPct.toFixed(1)}%</td><td class="num">${esc(mib(p.rssBytes))}</td><td>${esc(p.elapsedSec < 60 ? `${p.elapsedSec}s` : fmtDur(p.elapsedSec))}</td><td class="diagnostic-status ${stateLevel}">${esc(states[p.state] || p.state)}</td></tr>`;
    }).join('');
    const processTable = rows ? `<div class="table-scroll" role="region" aria-label="Agent workflow processes" tabindex="0"><table class="workflow-process-table"><thead><tr><th>Process</th><th class="num">PID</th><th class="num">CPU avg</th><th class="num">RSS</th><th>Elapsed</th><th>State</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="diagnostic-detail">${workflow.available ? 'No related OS processes detected. The scheduled pump normally exits between ticks; T3 worker activity is also tracked through the job records below.' : 'Cannot read the process list right now.'}</p>`;
    const jobRow = (job) => {
      const status = job.stale ? job.status === 'launched' ? 'Launch overdue' : 'Heartbeat overdue' : job.status;
      const color = job.stale || ['failed', 'blocked', 'stalled'].includes(job.status) ? 'warning' : '';
      const time = job.finishedAt ? `finished ${ago(job.finishedAt)}` : job.heartbeatAt ? `heartbeat ${ago(job.heartbeatAt)}` : job.createdAt ? `created ${ago(job.createdAt)}` : 'Time unavailable';
      return `<li class="process-row"><span class="process-name">${esc(job.id)}<span class="event-time">${esc(job.mode)} · ${esc(time)}</span></span><span class="diagnostic-status ${color}">${esc(status)}</span></li>`;
    };
    const jobs = !workflow.jobsAvailable ? '<p class="diagnostic-detail">Job records unavailable</p>'
      : `<h4>Active jobs: ${workflow.activeCount}${workflow.partial ? ' (partial reading)' : ''}</h4><ul class="diagnostic-list">${workflow.activeJobs.map(jobRow).join('') || '<li class="diagnostic-detail">No active job records</li>'}</ul>${workflow.activeCount > workflow.activeJobs.length ? '<p class="diagnostic-detail">Showing the first 20 active job records.</p>' : ''}
        ${workflow.recentJobs.length ? `<h4>Recent jobs</h4><ul class="diagnostic-list">${workflow.recentJobs.map(jobRow).join('')}</ul>` : ''}`;
    return `<article class="diagnostic-card workflow-card"><h3>Agentctl & build-workflow</h3><div class="workflow-summary"><span class="diagnostic-status ${level}">${esc(workflow.reason)}</span><span class="diagnostic-detail">${esc(pump)} · ${esc(tick)}</span></div>
      <div class="workflow-plans"><div class="diagnostic-row"><span>Daily plans (UTC)</span><strong class="diagnostic-status ${plansLevel}">${esc(plans?.launched ?? '—')} / ${esc(plans?.limit ?? '—')} launched today</strong></div>
        ${plansPct != null ? `<div class="meter ${plansLevel}" aria-hidden="true"><div class="fill" style="width:${plansPct}%"></div></div>` : ''}
        <p class="diagnostic-detail">${esc(plansDetail)}</p></div>
      <div class="workflow-summary"><span>${esc(count)}</span><span class="diagnostic-detail">${esc(resources)}</span></div>${processTable}
      ${workflow.truncated ? '<p class="diagnostic-detail">Showing the first 100 related processes.</p>' : ''}
      <div class="workflow-jobs">${jobs}</div><p class="diagnostic-detail">CPU is averaged over each process lifetime. Summed RSS can count shared memory more than once. Job records and OS process counts are separate; job heartbeats use the workflow’s configured deadlines.</p>
      ${workflow.partial ? '<p class="diagnostic-detail">Some job records could not be read; counts may be incomplete.</p>' : ''}</article>`;
  }

  async function loadWorkspace(force = false) {
    if (workspaceLoading) return;
    workspaceLoading = true;
    try {
      const res = await fetch(`/api/workspace${force ? '?force' : ''}`, { cache: 'no-store', signal: AbortSignal.timeout(12_000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      workspace = await res.json();
      workspaceError = false;
    } catch {
      workspaceError = true;
    } finally {
      workspaceLoading = false;
      renderWorkspace();
    }
  }

  async function refreshAll(force = false) {
    $('refresh').disabled = true;
    try {
      await Promise.all([load(force), loadWorkspace(force)]);
    } finally {
      $('refresh').disabled = false;
    }
  }

  // Derive everything the UI shows about one window at the current moment.
  function view(w, now) {
    let used = w.usedPct;
    let resetPassed = false;
    if (w.resetsAt && w.resetsAt <= now) { used = 0; resetPassed = true; }
    const left = Math.max(0, Math.min(100, 100 - used));
    const toReset = w.resetsAt && !resetPassed ? (w.resetsAt - now) / 1000 : null;
    const notStarted = !resetPassed && used <= 0 && toReset != null && w.windowSec && toReset >= w.windowSec - 120;
    let timeLeftPct = null, projectedLeft = null, runsOutIn = null;
    if (toReset != null && w.windowSec && !notStarted) {
      timeLeftPct = Math.max(0, Math.min(100, (toReset / w.windowSec) * 100));
      const elapsed = w.windowSec - toReset;
      if (used > 0 && elapsed > w.windowSec * 0.02) {
        const rate = used / elapsed;
        const proj = left - rate * toReset;
        if (proj < 0) runsOutIn = left / rate; else projectedLeft = proj;
      }
    }
    const level = left <= 10 ? 'critical' : left <= 30 ? 'warning' : null;
    return { used, left, toReset, notStarted, resetPassed, timeLeftPct, projectedLeft, runsOutIn, level };
  }

  function statusLabel(v) {
    if (v.left <= 0) return { cls: 'critical', text: '⛔ Limit reached' };
    if (v.level === 'critical') return { cls: 'critical', text: '⛔ Nearly out' };
    if (v.level === 'warning') return { cls: 'warning', text: '⚠ Low' };
    return null;
  }

  function resetText(w, v) {
    if (v.resetPassed) return 'reset since last reading';
    if (v.notStarted) return 'starts on first use';
    if (v.toReset == null) return w.windowSec ? '' : 'resets with billing cycle';
    return `resets in ${fmtDur(v.toReset)} · ${fmtClock(w.resetsAt)}`;
  }

  function footText(v) {
    if (v.resetPassed) return { text: 'Estimated. Refreshing…' };
    if (v.notStarted) return { text: 'Unused. The window starts when you send your first request.' };
    if (v.runsOutIn != null) return { text: `⚠ At this pace it runs out in ${fmtDur(v.runsOutIn)}, before the reset`, warn: true };
    if (v.projectedLeft != null) return { text: `At this pace, about ${Math.round(v.projectedLeft)}% left at reset` };
    return { text: '' };
  }

  function tipHtml(a, w, v) {
    const rows = [
      [`${a.name} ${a.plan || ''}`.trim(), w.label],
      ['Left', `${Math.round(v.left)}%`],
      ['Used', `${Math.round(v.used)}%`],
      ['Window', fmtWindow(w.windowSec)],
    ];
    if (w.shareOfWeeklyPct != null) rows.push(['Allowance', `${w.shareOfWeeklyPct}% of the weekly limit`]);
    if (w.resetsAt && !v.notStarted) rows.push(['Resets', fmtFull(w.resetsAt)]);
    if (v.timeLeftPct != null) rows.push(['Time left', `${Math.round(v.timeLeftPct)}% of window`]);
    if (a.stale) rows.push(['Reading', `from ${ago(a.fetchedAt)}`]);
    return rows.map(([k, val]) => `<div><span class="k">${esc(k)}:</span> ${esc(val)}</div>`).join('');
  }

  function renderWindow(a, w, now, ai, wi) {
    const v = view(w, now);
    const st = statusLabel(v);
    const foot = footText(v);
    const aria = `${w.label}: ${Math.round(v.left)} percent left, ${resetText(w, v)}`;
    return `
      <div class="win" tabindex="0" data-a="${ai}" data-w="${wi}" aria-label="${esc(aria)}">
        <div class="win-top"><span class="win-label">${esc(w.label)}</span><span class="win-reset">${esc(resetText(w, v))}</span></div>
        <div class="win-main">
          <span class="big">${Math.round(v.left)}%</span><span class="big-unit">left</span>
          ${st ? `<span class="status ${st.cls}">${st.text}</span>` : ''}
        </div>
        <div class="meter ${v.level || ''}" aria-hidden="true">
          <div class="fill" style="width:${v.left}%"></div>
          ${v.timeLeftPct != null ? `<div class="pace" style="left:${v.timeLeftPct}%"></div>` : ''}
        </div>
        <div class="win-foot ${foot.warn ? 'warn' : ''}">${esc(foot.text)}</div>
      </div>`;
  }

  function renderCard(a, now, ai) {
    const mono = a.provider === 'claude' ? '✳' : '◎';
    const sub = a.email || '';
    const via = `Read from ${a.sources?.join(' + ') || 'n/a'}`;
    const fresh = a.stale
      ? `<span class="fresh stale" title="${esc(`${a.error} ${via}`)}">◷ ${esc(ago(a.fetchedAt))}</span>`
      : a.error ? '' : `<span class="fresh" title="${esc(via)}">● Live</span>`;
    const body = a.windows?.length
      ? a.windows.map((w, wi) => renderWindow(a, w, now, ai, wi)).join('')
      : '';
    const err = a.error ? `<div class="card-error">${a.stale ? 'Showing the last reading. ' : ''}${md(a.error)}</div>` : '';
    return `
      <article class="card">
        <header class="card-head">
          <div class="mono ${a.provider}" aria-hidden="true">${mono}</div>
          <div class="who">
            <div class="name">${esc(a.name)}${a.plan ? `<span class="plan">${esc(a.plan)}</span>` : ''}</div>
            <div class="sub" title="${esc(sub)}">${esc(sub)}</div>
          </div>
          ${fresh}
        </header>
        ${a.stale ? err : ''}${body}${a.stale ? '' : err}
      </article>`;
  }

  function renderTable(now) {
    const rows = data.accounts.flatMap((a) =>
      (a.windows || []).map((w) => {
        const v = view(w, now);
        const st = statusLabel(v);
        return `<tr>
          <td>${esc(a.name)} ${esc(a.plan || '')}<br><span style="color:var(--ink-muted)">${esc(a.email || '')}</span></td>
          <td>${esc(w.label)}</td>
          <td class="num">${Math.round(v.left)}%</td>
          <td class="num">${Math.round(v.used)}%</td>
          <td>${esc(resetText(w, v) || '–')}</td>
          <td>${st ? esc(st.text) : 'OK'}${a.stale ? ` (reading from ${esc(ago(a.fetchedAt))})` : ''}</td>
        </tr>`;
      }),
    );
    return `<div class="table-scroll" role="region" aria-label="Quota table" tabindex="0"><table>
      <thead><tr><th>Account</th><th>Window</th><th class="num">Left</th><th class="num">Used</th><th>Reset</th><th>Status</th></tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>`;
  }

  function render() {
    if (!data) return;
    const now = Date.now();
    $('meta').textContent = `Claude & ChatGPT · updated ${ago(data.generatedAt)}`;
    if (!data.accounts.length) {
      $('content').innerHTML = `<div class="empty">No Claude or ChatGPT logins found. Sign in with <code>claude</code> or <code>codex</code>, or add accounts to CLIProxyAPI (<code>~/.cli-proxy-api</code>).</div>`;
      $('legend').hidden = true;
      return;
    }
    $('content').innerHTML = tableView
      ? renderTable(now)
      : `<div class="grid">${data.accounts.map((a, ai) => renderCard(a, now, ai)).join('')}</div>`;
    $('legend').hidden = tableView;

    // Tab title: the tightest window per account, e.g. "25% · 95%".
    const tight = data.accounts.filter((a) => a.windows?.length).map((a) => Math.round(Math.min(...a.windows.map((w) => view(w, now).left))));
    document.title = tight.length ? `${tight.map((n) => `${n}%`).join(' · ')} · Quotas` : 'Quotas';

    // Once a live window passes its reset time, fetch fresh numbers shortly after.
    const passed = data.accounts.some((a) => !a.stale && a.windows?.some((w) => w.resetsAt && w.resetsAt <= now));
    if (passed && !reloadTimer) reloadTimer = setTimeout(() => { reloadTimer = null; load(true); }, 20_000);
  }

  async function load(force = false) {
    if (loading) return;
    loading = true;
    try {
      const res = await fetch(`/api/quotas${force ? '?force' : ''}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
      $('banner').innerHTML = '';
    } catch (err) {
      $('banner').innerHTML = `<div class="banner">Can't reach the quota server (${esc(err.message)}). Is <code>node server.mjs</code> running?</div>`;
    } finally {
      loading = false;
      render();
    }
  }

  // Hover / focus tooltip with exact numbers.
  const tip = $('tip');
  function showTip(el, x, y) {
    const a = data.accounts[+el.dataset.a], w = a.windows[+el.dataset.w];
    tip.innerHTML = tipHtml(a, w, view(w, Date.now()));
    tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    tip.style.left = `${Math.min(x + 14, innerWidth - r.width - 8)}px`;
    tip.style.top = `${Math.min(y + 14, innerHeight - r.height - 8)}px`;
  }
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest?.('.win');
    if (el) showTip(el, e.clientX, e.clientY); else tip.style.display = 'none';
  });
  document.addEventListener('focusin', (e) => {
    const el = e.target.closest?.('.win');
    if (!el) return;
    const r = el.getBoundingClientRect();
    showTip(el, r.left + 20, r.bottom - 10);
  });
  document.addEventListener('focusout', () => (tip.style.display = 'none'));

  $('refresh').onclick = () => refreshAll(true);
  $('view').onclick = () => {
    tableView = !tableView;
    $('view').setAttribute('aria-pressed', tableView);
    render();
  };
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && refreshAll());

  refreshAll();
  setInterval(() => document.visibilityState === 'visible' && loadWorkspace(), 30_000);
  setInterval(load, 120_000);
  setInterval(() => { render(); renderWorkspace(); }, 15_000);
</script>
</body>
</html>
