name: test

on:
  pull_request:
    branches: [main, agent/improvements]
  push:
    branches: [main, agent/improvements]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check modules
        run: for f in *.mjs; do node --check "$f"; done
      - name: Check deploy scripts
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck deploy/*.sh
      - name: Run tests
        run: npm test
