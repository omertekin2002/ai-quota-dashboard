name: test

on:
  pull_request:
    branches: [main, agent/improvements]
  push:
    branches: [main, agent/improvements]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check modules
        run: for f in *.mjs; do node --check "$f"; done
      - name: Check deploy scripts
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck deploy/*.sh
      - name: Run tests
        run: npm test

  # Headless-Chromium checks of the page at phone and desktop width (e2e/, see playwright.config.mjs).
  # The matrix job above stays install-free; only this job installs the Playwright devDependency.
  browser:
    name: browser (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
